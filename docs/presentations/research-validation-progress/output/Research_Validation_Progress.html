diness.","The original suite passed 205 cases despite material validation gaps. The expanded local suite passes 325 cases, with 18 upstream Keras/NumPy deprecation warnings. R006 verified hashes for 97 protected historical files and nine local assets. R007 independently recalculated counts and pairwise AUC for 25 recorded conditions. These are software and arithmetic checks, not 325 independent scientific claims.","Mathematics: exact distinct-score ROC/AUC, tie handling, interpolated EER, input checks, explicit SNR and H1 distribution conventions. Physical: fixed mock receiver gain, independent H0 calibration and ring-buffer invariants. Network: positive-duration PU/SU overlap, slot completion and horizon/pending accounting. AI: actual Keras convolutional training and restorable checkpoints. Broader receiver, network and dataset claims remain unresolved.","R002: 400 H0 calibration frames, 3,000 independent H0 test frames, 300 independent H1 frames. QPSK configured at +10 dB before ADC clipping. Pd=300/300; two-sided exact 95% interval [98.7779%,100%]. Pfa=49/3000; interval [1.2107%,2.1537%]. One-sided 95% Pd lower bound is 99.0064%, Pfa upper bound is 2.0678%. These results assume independent stationary trials and do not establish real SDR performance.","R003b: three native Keras CNNs underwent small two-epoch synthetic smoke training with separate train, validation, H0 calibration and test seeds. All three changed convolutional weights and restored checkpoint predictions exactly on the fixture. R006 independently found finite nonzero BCE gradients in both convolution kernels in all three checkpoints, excluding weight decay as the source of those probe gradients. Nine native TFLite files execute in the interpreter. BatchNorm has 23,073 parameters rather than the paper's 23,201. Native ONNX runtime and edge hardware evidence remain unavailable.","R005 uses a fixed synthetic GAP checkpoint and nominal calibration. Native FP32 Pfa is 5/300. Reusing the native threshold for INT8 yields 60/300 false alarms and changes 80/600 full-set decisions. A +1 dB common receiver gain applied to signal and noise preserves SNR and raises native Pfa to 170/300. Independent INT8 calibration produces only three distinct H0 score levels in this fixture and lowers 0 dB Pd from 97/100 native to 69/100 INT8. Each condition uses 300 H0 and 100 H1 frames per SNR. These findings do not falsify the differently trained original paper models.","Supported locally: corrected numerical routines, specified timing/buffer properties, native graph computation and executable TFLite artifacts. Failed under the tested synthetic conditions: native-to-INT8 threshold transfer and fixed-threshold gain robustness. Inconclusive: full RadioML reproduction, network superiority/PU-receiver protection and physical device latency/energy. The data, assumptions, protocol and hardware evidence determine the scope of confidence.","Recommended next milestone: obtain and verify RadioML 2018.01A, independently establish H0 noise according to a documented measurement contract, freeze train/validation/calibration/test partitions, and train one actual FP32 baseline CNN in a GPU environment. Compare it with energy detection on common sealed test trials. Report measured Pd and Pfa by SNR/modulation, exact intervals and variation across training seeds. RadioML modulation rows provide H1 and alone cannot establish Pfa. Document missing capture-group provenance. Dataset acquisition is recommended, not completed."];function ou(){let[e,t]=(0,v.useState)(window.innerWidth<760);return(0,v.useEffect)(()=>{let n=()=>t(window.innerWidth<760);return window.addEventListener("resize",n),()=>window.removeEventListener("resize",n)},[]),e}function J_({value:e,staticMode:t=!1}){let n=An(),r=Yo(t||n?e:0),i=bd(r,o=>Math.round(o).toLocaleString("en-US"));return(0,v.useEffect)(()=>{if(t||n){r.set(e);return}let o=Ed(r,e,{duration:.85,ease:[.16,1,.3,1]});return()=>o.stop()},[e,r,n,t]),v.default.createElement(Ie.
